<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="peak512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="alert512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg512)"/>
  <rect width="496" height="496" x="8" y="8" rx="92" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Mountain Peaks -->
  <polygon points="256,110 390,360 122,360" fill="url(#peak512)" opacity="0.95"/>
  <polygon points="256,110 308,220 256,205 204,220" fill="#FFFFFF" opacity="0.9"/>
  
  <polygon points="145,210 256,380 34,380" fill="#0284C7" opacity="0.6"/>
  <polygon points="367,210 478,380 256,380" fill="#0284C7" opacity="0.6"/>
  
  <!-- Radar Wave / Hazard Beacon -->
  <circle cx="256" cy="310" r="36" fill="url(#alert512)"/>
  <circle cx="256" cy="310" r="64" fill="none" stroke="#F43F5E" stroke-width="6" stroke-dasharray="10,10"/>
  <circle cx="256" cy="310" r="96" fill="none" stroke="#F43F5E" stroke-width="4" opacity="0.5"/>
</svg>
